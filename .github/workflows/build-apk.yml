name: Build Stralarp APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Make gradlew executable (if present)
        run: chmod +x gradlew || true

      - name: Build Debug + Release APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug assembleRelease --stacktrace --no-daemon
          else
            echo "No gradlew found – using provisioned Gradle"
            gradle assembleDebug assembleRelease --stacktrace --no-daemon
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Stralarp-debug
          path: |
            app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload Release APK (debug-signed, installable)
        uses: actions/upload-artifact@v4
        with:
          name: Stralarp-release
          path: |
            app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: warn
